# Soil-moisture gateway configuration (key=value, '#' starts a comment)
device            = /tmp/soilgw.fifo   # FIFO = virtual device (no kernel module needed)
log_dir           = ./logs
socket            = /tmp/soilgw.sock   # control socket used by soilgw-cli
offline_timeout_ms= 2000
window            = 5                  # moving-average window (samples)

# default thresholds (percent volumetric moisture)
low               = 25                 # below this => irrigation needed
high              = 80                 # above this => over-watering warning
hysteresis        = 5                  # alert clears at low+5 / high-5

# per-node overrides, e.g. a drought-tolerant crop in zone 3
node.3.low        = 18
node.3.high       = 70
